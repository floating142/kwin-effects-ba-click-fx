name: Release source archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source-archive:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream base-devel cmake extra-cmake-modules git github-cli kwin
          libepoxy ninja qt6-base qt6-declarative ripgrep vulkan-headers

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^project\([^)]* VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match project version v${version}" >&2
            exit 1
          fi

      - name: Build release archive
        run: JOBS=2 ./scripts/make-release.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          dist/kwin-effects-ba-click-fx-*.tar.xz
          dist/kwin-effects-ba-click-fx-*-SHA256SUMS.txt
          --clobber
