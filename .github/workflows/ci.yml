name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'preview/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
    inputs:
      compatibility:
        description: 'Also build on Fedora and Ubuntu'
        type: boolean
        default: false
      gpu_tests:
        description: 'Include offscreen GPU regressions on Arch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    # 同仓库的分支由 push 验证，避免 PR 再构建一次；fork PR 仍正常验证。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream base-devel ccache cmake extra-cmake-modules git kservice kwin libepoxy ninja
          qt6-base qt6-declarative ripgrep vulkan-headers

      - uses: actions/checkout@v4

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-arch-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-arch-ccache-

      - name: Report build environment
        run: ./scripts/ci-environment-report.sh

      - name: Verify release
        run: |
          ccache --max-size=256M
          JOBS="$(nproc)" ./scripts/verify-release.sh build/ci \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBA_CLICK_FX_BUILD_GPU_TESTS=${{ inputs.gpu_tests && 'ON' || 'OFF' }}
          ccache --show-stats

      - name: Upload environment report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ github.job }}
          path: build-environment.txt

  fedora:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          appstream cmake extra-cmake-modules gcc-c++ gettext git kwin-devel
          kf6-kcmutils-devel kf6-ki18n-devel kf6-kservice-devel
          libdrm-devel libepoxy-devel ninja-build qt6-qtbase-devel qt6-qtdeclarative-devel
          qt6-qttools-devel
          ripgrep vulkan-headers

      - uses: actions/checkout@v4

      - name: Report build environment
        run: ./scripts/ci-environment-report.sh

      - name: Verify release
        run: JOBS="$(nproc)" ./scripts/verify-release.sh build/ci

      - name: Upload environment report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ github.job }}
          path: build-environment.txt

  kubuntu:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream ca-certificates cmake extra-cmake-modules g++ git kwin-dev \
            libdrm-dev libepoxy-dev libkf6config-dev libkf6coreaddons-dev \
            libkf6i18n-dev libkf6kcmutils-dev libkf6service-dev libkf6windowsystem-dev \
            ninja-build pkg-config qt6-base-dev qt6-declarative-dev \
            qt6-tools-dev ripgrep libvulkan-dev
          update-ca-certificates

      - uses: actions/checkout@v4

      - name: Report build environment
        run: ./scripts/ci-environment-report.sh

      - name: Verify release
        run: JOBS="$(nproc)" ./scripts/verify-release.sh build/ci

      - name: Upload environment report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ github.job }}
          path: build-environment.txt
