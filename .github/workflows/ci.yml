name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake extra-cmake-modules git kwin libepoxy ninja
          qt6-base qt6-declarative

      - uses: actions/checkout@v4

      - name: Verify release
        run: JOBS=2 ./verify-release.sh build/ci
