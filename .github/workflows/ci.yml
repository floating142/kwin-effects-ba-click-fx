name: CI

on:
  push:
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream base-devel cmake extra-cmake-modules git kwin libepoxy ninja
          qt6-base qt6-declarative ripgrep vulkan-headers

      - uses: actions/checkout@v4

      - name: Verify release
        run: JOBS=2 ./verify-release.sh build/ci

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          appstream cmake extra-cmake-modules gcc-c++ gettext git kwin-devel
          kf6-kcmutils-devel kf6-ki18n-devel
          libdrm-devel libepoxy-devel ninja-build qt6-qtbase-devel qt6-qtdeclarative-devel
          qt6-qttools-devel
          ripgrep vulkan-headers

      - uses: actions/checkout@v4

      - name: Verify release
        run: JOBS=2 ./verify-release.sh build/ci

  # Kubuntu 26.04 compatibility target. The package assertion prevents this
  # job from silently testing a newer KWin from a rolling Ubuntu image.
  kubuntu-26-04-kwin-6-6:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream cmake extra-cmake-modules g++ git kwin-dev \
            libepoxy-dev libkf6config-dev libkf6coreaddons-dev \
            libkf6i18n-dev libkf6kcmutils-dev libkf6windowsystem-dev \
            ninja-build pkg-config qt6-base-dev qt6-declarative-dev \
            qt6-tools-dev ripgrep libvulkan-dev

      - uses: actions/checkout@v4

      - name: Assert Kubuntu KWin version
        run: |
          version="$(dpkg-query -W -f='${Version}' kwin-dev)"
          echo "kwin-dev=${version}"
          case "${version}" in
            6.6.*) ;;
            *) echo "Expected KWin 6.6.x, got ${version}" >&2; exit 1 ;;
          esac

      - name: Verify release
        run: JOBS=2 ./verify-release.sh build/ci
